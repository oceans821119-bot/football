<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="城北2年生 試合結果">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --navy:#132038;
    --navy-deep:#0b1526;
    --paper:#f4f0e6;
    --paper-card:#fbf9f3;
    --green:#2f6e4f;
    --green-bright:#3f9468;
    --line:#d9d2bf;
    --ink:#1c2230;
    --ink-soft:#6b6455;
    --gold:#a8792f;
    --red:#b5482f;
    --teamA:#1c7c74;
    --teamA-soft:#e3f2f0;
    --teamB:#7c3f6b;
    --teamB-soft:#f4e9f1;
    --posGK:#8a5a2b;
    --posDF:#2b5a8a;
    --posMF:#2f6e4f;
    --posFW:#a13a34;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}

  header{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:#f4f0e6;
    padding:22px 20px 16px;
    position:sticky;top:0;z-index:20;
    box-shadow:0 6px 16px rgba(11,21,38,0.25);
  }
  .eyebrow{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:#9fb3c8;margin:0 0 4px;font-weight:600;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:20px;
    line-height:1.35;
    margin:0 0 14px;
    letter-spacing:.02em;
  }
  .team-name-input{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:20px;
    letter-spacing:.02em;
    color:#f4f0e6;
    background:none;
    border:none;
    border-bottom:1px dashed rgba(244,240,230,0.35);
    padding:0 0 2px;
    outline:none;
    width:100%;
    max-width:100%;
  }
  .team-name-input::placeholder{color:rgba(244,240,230,0.45);}
  .team-name-input:focus{border-bottom-color:var(--green-bright);}
  .match-row{display:flex;gap:8px;}
  .field{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;}
  .field label{font-size:11px;color:#9fb3c8;font-weight:600;}
  .field input{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    padding:11px 14px;
    font-size:16px;
    font-family:inherit;
    outline:none;
    box-sizing:border-box;
    width:100%;
    min-width:0;
    -webkit-appearance:none;
    appearance:none;
  }
  .field input::-webkit-calendar-picker-indicator{
    margin:0;
    padding:0;
  }
  .field input::-webkit-date-and-time-value{
    text-align:left;
  }
  .field input::placeholder{color:var(--ink-soft);}
  .field input:focus{border-color:var(--green-bright);}
  .field.opponent{flex:1.6;}

  .mode-tabs{
    display:flex;margin:16px 20px 0;
    border-bottom:1px solid var(--line);
  }
  .mode-tab{
    flex:1;padding:10px 0 9px;text-align:center;
    font-weight:700;font-size:14px;color:var(--ink-soft);
    background:none;border:none;font-family:inherit;
    cursor:pointer;position:relative;
  }
  .mode-tab.active{color:var(--navy);}
  .mode-tab.active::after{
    content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
    background:var(--navy);
  }

  .team-switch{display:flex;gap:8px;margin:14px 20px 0;}
  .team-chip{
    flex:1;padding:10px 0;border-radius:10px;
    text-align:center;font-weight:700;font-size:14px;
    border:1.5px solid var(--line);background:var(--paper-card);
    color:var(--ink-soft);cursor:pointer;font-family:inherit;
    transition:all .12s;
  }
  .team-chip.teamA.active{background:var(--teamA);border-color:var(--teamA);color:#fff;}
  .team-chip.teamB.active{background:var(--teamB);border-color:var(--teamB);color:#fff;}

  .score-panel{
    margin:14px 20px 0;background:var(--navy);border-radius:12px;padding:14px 16px;color:#f4f0e6;
  }
  .score-panel .vs-label{font-size:11px;color:#9fb3c8;margin-bottom:8px;font-weight:600;letter-spacing:.05em;}
  .score-inputs{display:flex;align-items:center;justify-content:center;gap:12px;}
  .score-inputs input{
    width:56px;text-align:center;font-size:26px;font-weight:800;
    background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.25);
    border-radius:8px;color:#fff;padding:6px 0;font-family:inherit;
  }
  .score-dash{font-size:22px;color:#9fb3c8;font-weight:700;}
  .score-team-label{font-size:11px;color:#9fb3c8;text-align:center;margin-top:4px;}
  .score-cols{display:flex;gap:12px;align-items:flex-start;justify-content:center;}
  .score-cols>div{flex:none;}

  /* comments */
  .comment-panel{margin:14px 20px 140px;display:flex;flex-direction:column;gap:10px;}
  .comment-block label{
    font-size:12.5px;font-weight:700;color:var(--ink-soft);
    display:flex;align-items:center;gap:4px;margin-bottom:5px;
  }
  .comment-block label .req{color:var(--red);font-size:11px;font-weight:800;}
  .comment-block textarea{
    width:100%;min-height:64px;padding:10px 12px;border-radius:9px;
    border:1px solid var(--line);font-family:inherit;font-size:16px;
    background:var(--paper-card);resize:vertical;outline:none;line-height:1.5;
  }
  .comment-block textarea:focus{border-color:var(--green);}
  .comment-block.good label{color:var(--green);}
  .comment-block.issue label{color:#9a5a1f;}
  .comment-block.other label{color:var(--ink-soft);}

  .goals-panel{margin:14px 20px 0;}
  .goals-title{
    font-size:12.5px;font-weight:700;color:var(--ink-soft);
    margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;
  }
  .add-goal-btn{
    width:100%;
    background:var(--green);color:#fff;border:none;
    border-radius:10px;padding:13px 0;font-size:15px;font-weight:700;
    font-family:inherit;cursor:pointer;margin-bottom:10px;
    box-shadow:0 4px 10px rgba(47,110,79,0.25);
  }
  .add-goal-btn:active{background:var(--green-bright);}
  .goal-item{
    display:flex;align-items:center;gap:8px;
    background:var(--paper-card);border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;margin-bottom:7px;font-size:13.5px;

  .goal-item .half-tag{
    flex:none;font-size:10.5px;font-weight:700;color:#fff;

  }
  .goal-item .goal-text{flex:1;line-height:1.4;}
  .goal-item .goal-text b{font-weight:700;}
  .goal-item .assist-text{color:var(--ink-soft);font-size:12px;}
  .goal-item .del{
    flex:none;background:none;border:none;color:var(--red);font-size:18px;
    cursor:pointer;padding:0 2px;font-family:inherit;line-height:1;
  }
  .goal-empty{font-size:12.5px;color:var(--ink-soft);padding:6px 2px 2px;}

  .goal-form, .add-player-form{

  .goal-form .half-pick{display:flex;gap:6px;}
  .goal-form .half-pick button{
    flex:1;padding:7px 0;border-radius:7px;border:1.5px solid var(--line);

  }
  .goal-form .half-pick button.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .goal-form .form-actions, .add-player-form .form-actions{display:flex;gap:8px;margin-top:2px;}
  .goal-form .form-actions button, .add-player-form .form-actions button{
    flex:1;padding:9px 0;border-radius:8px;font-weight:700;font-size:13px;
    font-family:inherit;border:none;cursor:pointer;
  }
  .goal-form .confirm, .add-player-form .confirm{background:var(--green);color:#fff;}
  .goal-form .cancel, .add-player-form .cancel{background:var(--line);color:var(--ink);}

  .tabs{display:flex;margin:16px 20px 0;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  .tab{
    flex:1;padding:11px 0;text-align:center;font-weight:700;font-size:14px;color:var(--ink-soft);

    position:relative;transition:background .15s,color .15s;

  .tab.active{background:var(--navy);color:#f4f0e6;}
  .tab .count{display:block;font-size:11px;font-weight:600;margin-top:2px;opacity:.8;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:14px 20px 6px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;gap:6px;}

  .toolbar .actions button{background:none;border:none;color:var(--green);font-weight:700;font-size:12.5px;font-family:inherit;cursor:pointer;padding:4px 6px;}

  .assign-counts{display:flex;gap:10px;font-size:12px;}
  .assign-counts b{color:var(--ink);}
  .add-player-btn{
    width:100%;
    background:var(--green);color:#fff;border:none;
    border-radius:10px;padding:13px 0;font-size:15px;font-weight:700;

    box-shadow:0 4px 10px rgba(47,110,79,0.3);
  }
  .add-player-btn:active{background:var(--green-bright);}
  .bulk-btn{
    background:none;color:var(--navy);border:1.5px solid var(--navy);
    border-radius:10px;padding:11px 0;font-size:13.5px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  .bulk-btn:active{background:rgba(19,32,56,0.06);}
  .bulk-form{
    background:var(--paper-card);border:1px solid var(--line);border-radius:10px;

  }
  .bulk-form label{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .bulk-form .bulk-hint{
    font-size:11.5px;color:var(--ink-soft);line-height:1.6;
    background:#fff;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;
  }
  .bulk-form textarea{
    width:100%;min-height:160px;padding:10px;border-radius:8px;border:1px solid var(--line);
    font-family:inherit;font-size:16px;line-height:1.5;background:#fff;
    resize:vertical;box-sizing:border-box;
  }
  .bulk-form .form-actions{display:flex;gap:8px;}
  .bulk-form .form-actions button{
    flex:1;padding:10px 0;border-radius:8px;font-weight:700;font-size:13px;
    font-family:inherit;border:none;cursor:pointer;
  }
  .bulk-form .confirm{background:var(--green);color:#fff;}
  .bulk-form .cancel{background:var(--line);color:var(--ink);}
  .bulk-result{font-size:12.5px;color:var(--ink-soft);white-space:pre-line;line-height:1.6;}

  .search-wrap{margin:6px 20px 4px;}
  .search-wrap input{
    width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
    font-size:16px;font-family:inherit;background:var(--paper-card);outline:none;
  }
  .search-wrap input:focus{border-color:var(--green);}
  .hint-row{margin:2px 20px 0;font-size:11.5px;color:var(--ink-soft);}

  .roster{flex:1;padding:6px 20px 120px;display:flex;flex-direction:column;gap:8px;}
  .player{
    display:flex;align-items:center;gap:8px;background:var(--paper-card);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    user-select:none;transition:border-color .12s, background .12s;
  }
  .player.checkable{cursor:pointer;}
  .player.checked{border-color:var(--green);background:#eef5ee;}
  .num{
    width:34px;height:34px;flex:none;border-radius:50%;background:var(--navy);color:#f4f0e6;
    font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;
  }
  .info{flex:1;min-width:0;-webkit-user-select:none;}
  .name{font-size:15px;font-weight:600;line-height:1.3;}
  .kana{font-size:11px;color:var(--ink-soft);letter-spacing:.02em;}
  .pos-badge{
    flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff;
  }
  .pos-badge.GK{background:var(--posGK);}
  .pos-badge.DF{background:var(--posDF);}
  .pos-badge.MF{background:var(--posMF);}
  .pos-badge.FW{background:var(--posFW);}
  .ab-toggle{flex:none;display:flex;gap:4px;}
  .ab-btn{
    width:28px;height:28px;border-radius:7px;border:1.5px solid var(--line);background:#fff;
    font-size:12.5px;font-weight:800;font-family:inherit;color:var(--ink-soft);cursor:pointer;
  }
  .ab-btn.a-on{background:var(--teamA);border-color:var(--teamA);color:#fff;}
  .ab-btn.b-on{background:var(--teamB);border-color:var(--teamB);color:#fff;}
  .del-btn{
    flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);
    background:#fff;color:var(--red);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .check{
    flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);

  .player.checked .check{background:var(--green);border-color:var(--green);}
  .check svg{width:14px;height:14px;opacity:0;}
  .player.checked .check svg{opacity:1;}

  .empty-msg{text-align:center;color:var(--ink-soft);font-size:13px;padding:30px 16px;line-height:1.6;}

  footer{
    position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;

    padding:14px 20px 18px;z-index:30;
  }

    width:100%;color:#fff;border:none;border-radius:12px;padding:15px 0;

  }

  .send-btn.teamB{background:var(--teamB);}
  .send-btn.assignMode{background:var(--navy);}
  .copy-link{
    display:block;text-align:center;margin-top:9px;font-size:12.5px;color:var(--ink-soft);
    text-decoration:underline;background:none;border:none;width:100%;font-family:inherit;cursor:pointer;
  }

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;z-index:50;white-space:nowrap;max-width:80%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .saved-note{text-align:center;font-size:11px;color:var(--ink-soft);opacity:.75;margin:10px 20px 0;}

  /* detail / edit modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(11,21,38,0.55);
    display:none;align-items:flex-end;justify-content:center;z-index:100;
  }
  .modal-overlay.show{display:flex;}
  .modal-sheet{
    width:100%;max-width:560px;background:var(--paper-card);
    border-radius:18px 18px 0 0;padding:20px 20px 26px;
    max-height:85vh;overflow-y:auto;
    animation:sheetUp .18s ease-out;
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .modal-num{
    width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none;
  }
  .modal-title{flex:1;}
  .modal-title .m-name{font-size:18px;font-weight:700;}
  .modal-title .m-kana{font-size:12px;color:var(--ink-soft);}
  .modal-close{
    background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;
    padding:4px;line-height:1;
  }
  .detail-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .detail-row{display:flex;justify-content:space-between;align-items:center;
    padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;}
  .detail-row .d-label{color:var(--ink-soft);font-size:12.5px;font-weight:600;}
  .detail-row .d-value{font-weight:600;text-align:right;}
  .edit-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .edit-row label{font-size:11.5px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:3px;}
  .edit-row input, .edit-row select{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
    font-family:inherit;font-size:16px;background:#fff;
  }
  .modal-actions{display:flex;gap:8px;}
  .modal-actions button{
    flex:1;padding:11px 0;border-radius:9px;font-weight:700;font-size:14px;
    font-family:inherit;border:none;cursor:pointer;
  }
  .modal-actions .edit-btn{background:var(--navy);color:#fff;}
  .modal-actions .save-btn{background:var(--green);color:#fff;}
  .modal-actions .cancel-btn{background:var(--line);color:var(--ink);}
  .modal-actions .danger-btn{background:var(--red);color:#fff;}
  .confirm-msg{font-size:14px;line-height:1.6;color:var(--ink);margin-bottom:18px;white-space:pre-line;}
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow">チーム名</p>
    <h1>
      <input id="teamNameInput" class="team-name-input" type="text" placeholder="例）鳥取城北高校2年生" maxlength="40">
      <br>試合結果
    </h1>
    <div class="match-row">
      <div class="field opponent">
        <label for="opponent">対戦相手 <span style="color:#e08a6b;">必須</span></label>
        <input id="opponent" type="text" placeholder="例）鳥取商業高校">
      </div>
      <div class="field" style="max-width:130px; margin-right:18px;">
        <label for="matchDate">日付</label>
        <input id="matchDate" type="date">
      </div>
    </div>
  </header>

  <div class="mode-tabs">
    <button class="mode-tab active" id="modeResult" data-mode="result">出場結果</button>
    <button class="mode-tab" id="modeAssign" data-mode="assign">選手登録</button>
  </div>
  <p class="saved-note" id="assignSavedNote">選手登録・名簿の変更はこの端末に保存され、閉じても消えません</p>
  <p class="hint-row" id="longPressHint">選手名を長押しすると詳細・編集ができます</p>

  <div class="team-switch" id="teamSwitch" style="display:none;">
    <button class="team-chip teamA active" id="teamAChip">Group A</button>
    <button class="team-chip teamB" id="teamBChip">Group B</button>
  </div>

  <div class="score-panel" id="scorePanel" style="display:none;">
    <div class="vs-label">試合結果</div>
    <div class="score-cols">
      <div>
        <div class="score-inputs"><input type="number" min="0" id="scoreOwn" inputmode="numeric"></div>
        <div class="score-team-label">自チーム</div>
      </div>
      <div class="score-dash">-</div>
      <div>
        <div class="score-inputs"><input type="number" min="0" id="scoreOpp" inputmode="numeric"></div>
        <div class="score-team-label">相手</div>
      </div>
    </div>
  </div>

  <div class="goals-panel" id="goalsPanel" style="display:none;">
    <div class="goals-title">
      <span>得点・アシスト</span>
    </div>
    <button class="add-goal-btn" id="addGoalBtn">＋ 得点者を追加</button>
    <div id="goalForm"></div>
    <div id="goalList"></div>
  </div>

  <div class="tabs" id="halfTabs" style="display:none;">
    <button class="tab active" id="tabFirst" data-half="first">
      前半
      <span class="count" id="countFirst">出場 0名</span>
    </button>
    <button class="tab" id="tabSecond" data-half="second">
      後半
      <span class="count" id="countSecond">出場 0名</span>
    </button>
  </div>

  <div class="search-wrap">
    <input id="search" type="text" placeholder="名前・背番号で検索">
  </div>

  <div style="margin:10px 20px 0;display:flex;gap:8px;" id="addPlayerBtnWrap">
    <button class="add-player-btn" id="addPlayerBtn" style="flex:1.3;">＋ 選手を登録</button>
    <button class="bulk-btn" id="bulkBtn" style="flex:1;">一括登録・編集</button>
  </div>
  <div style="margin:8px 20px 0;" id="exportBtnWrap">
    <button class="bulk-btn" id="exportBtn" style="width:100%;">選手データを出力（Excel/スプレッドシート用）</button>
  </div>
  <div id="addPlayerFormWrap" style="margin:0 20px;"></div>
  <div id="bulkFormWrap" style="margin:0 20px;"></div>

  <div class="toolbar" id="assignToolbar">
    <span class="assign-counts">
      <span>A：<b id="countA">0</b>名</span>
      <span>B：<b id="countB">0</b>名</span>
      <span>未振分：<b id="countUn">0</b>名</span>
    </span>
    <span class="actions">
      <button id="resetAssign">全解除</button>
    </span>
  </div>

  <div class="toolbar" id="checkToolbar" style="display:none;">
    <span id="visibleCount">0名</span>
    <span class="actions">
      <button id="checkAll">全選択</button>
      <button id="uncheckAll">解除</button>
    </span>
  </div>

  <div class="roster" id="roster"></div>

  <div class="comment-panel" id="commentPanel" style="display:none;">
    <div class="comment-block good">
      <label>良かった点 <span class="req">必須</span></label>
      <textarea id="commentGood" placeholder="例）前線からのプレスが機能し、ボール奪取から得点につながった"></textarea>
    </div>
    <div class="comment-block issue">
      <label>課題点 <span class="req">必須</span></label>
      <textarea id="commentIssue" placeholder="例）セットプレーの守備対応に課題が残った"></textarea>
    </div>
    <div class="comment-block other">
      <label>コメント（任意）</label>
      <textarea id="commentOther" placeholder="例）次回の練習で修正するポイントなど"></textarea>
    </div>
  </div>

  <footer id="footer" style="display:none;">
    <button class="send-btn teamA" id="sendLine">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 5.94 2 10.8c0 3.06 1.94 5.76 4.86 7.32-.18.68-1.15 4.05-1.19 4.31 0 0-.02.19.1.27.12.08.27.02.27.02.35-.05 4.05-2.65 4.7-3.11.85.12 1.73.19 2.26.19 5.52 0 10-3.94 10-8.8S17.52 2 12 2Z" fill="#fff"/></svg>
      <span id="sendLineLabel">テキストをコピー＆LINEを開く</span>
    </button>
  </footer>
  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet" id="modalSheet"></div>
  </div>

  <div class="modal-overlay" id="confirmOverlay">
    <div class="modal-sheet" id="confirmSheet"></div>
  </div>

  <div class="modal-overlay" id="exportOverlay">
    <div class="modal-sheet" id="exportSheet"></div>
  </div>
</div>

let overrides = {};   // no -> {name?,kana?,pos?,origin?,prevTeam?}
let addedNos = [];    // no's of players registered via "選手を登録" (fully defined in overrides)
let deletedNos = new Set(); // no's removed from the roster

function baseHas(no){ return ROSTER_BASE.some(p=>p.no===no); }

function player(no){
  if(baseHas(no)){
    const base = ROSTER_BASE.find(p=>p.no===no);
    const info = ROSTER_INFO[no] || {};
    const ov = overrides[no] || {};
    return Object.assign({}, base, info, ov);
  }
  // fully custom player
  const ov = overrides[no] || {};
  return Object.assign({no, name:'（未設定）', kana:'', pos:'MF', origin:'', prevTeam:''}, ov);
}

function getAllNos(){
  const nos = [...ROSTER_BASE.map(p=>p.no), ...addedNos];
  return nos.filter(no=>!deletedNos.has(no)).sort((a,b)=>a-b);
}

const POS_CATEGORY = {};
POSITION_GROUPS.forEach(g=>{ g.options.forEach(o=>{ POS_CATEGORY[o] = g.label; }); });

const POS_LABEL_JA = {
  GK:'ゴールキーパー',
  DF:'ディフェンダー', CB:'センターバック', SB:'サイドバック', RB:'ライトバック', LB:'レフトバック', SW:'スイーパー', WB:'ウイングバック',

// ---- long press detection ----
let pressTimer = null;
let pressFired = false;
const LONG_PRESS_MS = 480;

function attachLongPress(el, no){
  const start = ()=>{
    pressFired = false;
    pressTimer = setTimeout(()=>{
      pressFired = true;
      if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
      openDetail(no);
    }, LONG_PRESS_MS);
  };
  const cancel = ()=>{ clearTimeout(pressTimer); };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
}

function renderRoster(){
  const q = searchEl.value.trim().toLowerCase();
  rosterEl.innerHTML = '';
  let visible = 0;

  const list = getAllNos().map(no=>player(no)).filter(p=>{
    if(mode === 'result' && assignment[p.no] !== currentTeam) return false;
    return true;
  });

  list.forEach(p=>{
    const hay = (p.name + p.kana + p.no).toLowerCase();
    if(q && !hay.includes(q)) return;
    visible++;

    const row = document.createElement('div');
    let rightControl = '';

    if(mode === 'assign'){
      const a = assignment[p.no];
      rightControl = `
        <span class="pos-badge ${posCategory(p.pos)}">${p.pos}</span>
        <div class="ab-toggle">
          <button class="ab-btn ${a==='A' ? 'a-on':''}" data-act="assignA" data-no="${p.no}">A</button>

    } else {
      const isChecked = selected[currentTeam][currentHalf].has(p.no);
      row.className = 'player checkable' + (isChecked ? ' checked' : '');
      rightControl = `
        <span class="pos-badge ${posCategory(p.pos)}">${p.pos}</span>
        <div class="check">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>`;
    }

    row.innerHTML = `
      <div class="num">${p.no}</div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="kana">${p.kana}</div>
      </div>
      ${rightControl}
    `;

    const infoEl = row.querySelector('.info');
    attachLongPress(infoEl, p.no);

    if(mode === 'assign'){
      row.querySelector('[data-act="assignA"]').addEventListener('click', (e)=>{
        e.stopPropagation();
        toggleAssignment(p.no, 'A');
      });
      row.querySelector('[data-act="assignB"]').addEventListener('click', (e)=>{

        toggleAssignment(p.no, 'B');
      });
      row.querySelector('[data-act="delete"]').addEventListener('click', (e)=>{
        e.stopPropagation();

      });

      row.addEventListener('click', ()=>{

        toggleAttendance(p.no);
      });

    rosterEl.appendChild(row);
  });

  if(mode === 'result'){
    document.getElementById('visibleCount').textContent = visible + '名';

  if(visible === 0){
    if(mode === 'result'){
      rosterEl.innerHTML = `<div class="empty-msg">${teamLabel(currentTeam)}に選手が振り分けられていません。<br><a id="goAssign">「選手登録」</a>で先に選手を登録してください。</div>`;

      if(link) link.addEventListener('click', ()=>switchMode('assign'));
    } else {
      rosterEl.innerHTML = '<div class="empty-msg">該当する選手が見つかりません</div>';
    }
  }

  updateAssignCounts();
}

function deletePlayer(no){
  const p = player(no);
  showConfirmDialog(
    '選手を削除しますか？',
    `${p.no} ${p.name} を名簿から削除します。\n選手登録・出場結果・得点記録からも同時に削除され、元に戻せません。`,
    '削除する',
    ()=>{
      if(addedNos.includes(no)){
        addedNos = addedNos.filter(n=>n!==no);
        delete overrides[no];
      } else {
        deletedNos.add(no);
      }
      delete assignment[no];
      selected.A.first.delete(no); selected.A.second.delete(no);
      selected.B.first.delete(no); selected.B.second.delete(no);
      ['A','B'].forEach(team=>{
        goals[team] = goals[team]
          .filter(g=>g.scorer !== no)
          .map(g=> g.assist === no ? {...g, assist:null} : g);
      });

      persist();
      persistOverrides();
      renderRoster();
      updateHalfCounts();
      showToast('選手を削除しました');
    }
  );
}

function parseBulkRow(line){
  // Accept tab-separated (pasted from spreadsheets) or comma-separated.
  const delim = line.includes('\t') ? '\t' : ',';
  const cols = line.split(delim).map(c=>c.trim());
  const [noStr, name, kana, pos, origin, prevTeam, group] = cols;
  return { noStr, name, kana, pos, origin, prevTeam, group };
}

function renderBulkForm(){
  const el = document.getElementById('bulkFormWrap');
  if(!bulkFormOpen){ el.innerHTML=''; return; }
  el.innerHTML = `
    <div class="bulk-form">
      <div>
        <label>選手一覧を貼り付け</label>
        <div class="bulk-hint">1行につき1人、背番号,氏名,フリガナ,Pos,出身,前所属,グループ の順（フリガナ以降は省略可）。グループはA・Bのいずれかを入力（空欄なら変更なし）。表計算ソフトから複数列コピペした場合はタブ区切りにも対応。既存の背番号と同じ場合は情報を上書き更新、新しい背番号は新規登録されます。</div>
        <textarea id="bulkText" placeholder="12,山田太郎,ヤマダタロウ,MF,鳥取,〇〇FC,A&#10;13,佐藤次郎,サトウジロウ,DF,大阪,△△中学校,B"></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="cancel" id="bulkCancel">キャンセル</button>
        <button type="button" class="confirm" id="bulkConfirm">取り込む</button>
      </div>
      <div class="bulk-result" id="bulkResult"></div>
    </div>
  `;
  document.getElementById('bulkCancel').addEventListener('click', ()=>{
    bulkFormOpen = false; renderBulkForm();
  });
  document.getElementById('bulkConfirm').addEventListener('click', ()=>{
    const raw = document.getElementById('bulkText').value;
    const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length > 0);
    if(lines.length === 0){ showToast('貼り付ける内容がありません'); return; }

    let added = 0, updated = 0, skipped = 0;
    const skippedLines = [];

    lines.forEach(line=>{
      const { noStr, name, kana, pos, origin, prevTeam, group } = parseBulkRow(line);
      const no = Number(noStr);
      if(!noStr || !Number.isFinite(no) || no <= 0 || !name){
        skipped++; skippedLines.push(line);
        return;
      }
      const posClean = (pos || '').toUpperCase();
      const validPos = POS_CATEGORY[posClean] ? posClean : undefined;
      const groupClean = (group || '').trim().toUpperCase();

      const exists = getAllNos().includes(no);
      const prevOverride = overrides[no] || {};
      overrides[no] = {
        name: name || prevOverride.name,
        kana: kana !== undefined ? kana : prevOverride.kana,
        pos: validPos || prevOverride.pos,
        origin: origin !== undefined ? origin : prevOverride.origin,
        prevTeam: prevTeam !== undefined ? prevTeam : prevOverride.prevTeam,
      };

      if(groupClean === 'A' || groupClean === 'B'){
        assignment[no] = groupClean;
      }
      // 空欄・不正な値の場合は既存のグループ割り当てをそのまま維持する。

      if(exists){
        updated++;
      } else {
        addedNos.push(no);
        deletedNos.delete(no);
        added++;
      }
    });

    persist();
    persistOverrides();
    renderRoster();

    const resultEl = document.getElementById('bulkResult');
    let msg = `新規登録：${added}件 / 更新：${updated}件`;
    if(skipped > 0){
      msg += ` / スキップ：${skipped}件（背番号か氏名が読み取れませんでした）`;
    }
    resultEl.textContent = msg;
    showToast('取り込みが完了しました');
  });
}

function toggleAttendance(no){
  const set = selected[currentTeam][currentHalf];
  const willAdd = !set.has(no);
  if(willAdd) set.add(no); else set.delete(no);

  // 前半での選択は後半にも引き継ぐ（一方向）。後半での変更は前半に影響させない。
  if(currentHalf === 'first'){
    const secondSet = selected[currentTeam].second;
    if(willAdd) secondSet.add(no); else secondSet.delete(no);
  }

  persist();
  renderRoster();
  updateHalfCounts();
}

function toggleAssignment(no, team){
  if(assignment[no] === team){
    delete assignment[no];
  } else {
    const prev = assignment[no];
    if(prev){
      selected[prev].first.delete(no);
      selected[prev].second.delete(no);

function buildMessage(){
  const opponent = document.getElementById('opponent').value.trim() || '（対戦相手未入力）';
  const dateRaw = document.getElementById('matchDate').value;
  let dateStr = '';
  if(dateRaw){
    const d = new Date(dateRaw + 'T00:00:00');

  }
  const firstList = getAllNos().filter(no=>assignment[no]===currentTeam && selected[currentTeam].first.has(no)).map(player).sort((a,b)=>a.no-b.no);
  const secondList = getAllNos().filter(no=>assignment[no]===currentTeam && selected[currentTeam].second.has(no)).map(player).sort((a,b)=>a.no-b.no);
  const teamGoals = goals[currentTeam];
  const own = scores[currentTeam].own;
  const opp = scores[currentTeam].opp;
  const good = comments[currentTeam].good.trim();
  const issue = comments[currentTeam].issue.trim();
  const other = comments[currentTeam].other.trim();

  let msg = `【${teamLabel(currentTeam)}】${opponent}戦${dateStr ? ' ' + dateStr : ''}\n`;
  msg += `━━━━━━━━━━\n`;
  msg += `結果　${own === '' ? '-' : own} - ${opp === '' ? '-' : opp}\n`;
  msg += `━━━━━━━━━━\n`;
  msg += `得点・アシスト\n`;
  if(teamGoals.length){
    msg += teamGoals.map(g=>{
      const scorer = player(g.scorer);
      const assist = g.assist ? player(g.assist) : null;
      const halfLabel = g.half === 'first' ? '前半' : '後半';
      let line = `${halfLabel} ${scorer.no} ${scorer.name}`;
      if(assist) line += `（アシスト：${assist.no} ${assist.name}）`;
      return line;
    }).join('\n');
  } else {
    msg += '（登録なし）';
  }
  msg += `\n━━━━━━━━━━\n`;
  msg += `良かった点\n${good}\n`;
  msg += `━━━━━━━━━━\n`;
  msg += `課題点\n${issue}\n`;
  if(other){
    msg += `━━━━━━━━━━\n`;
    msg += `コメント\n${other}\n`;
  }
  msg += `━━━━━━━━━━\n`;
  msg += `前半 出場（${firstList.length}名）\n`;
  msg += firstList.length ? firstList.map(p=>`${String(p.no).padStart(2,' ')} ${p.name}（${p.pos}）`).join('\n') : '（未選択）';
  msg += `\n━━━━━━━━━━\n`;
  msg += `後半 出場（${secondList.length}名）\n`;
  msg += secondList.length ? secondList.map(p=>`${String(p.no).padStart(2,' ')} ${p.name}（${p.pos}）`).join('\n') : '（未選択）';
  return msg;
}

function formatPlayerDetailLine(p){
  let line = `${String(p.no).padStart(2,' ')} ${p.name}（${p.kana}）${p.pos}`;
  const extra = [];
  if(p.origin) extra.push(p.origin);
  if(p.prevTeam) extra.push(p.prevTeam);
  if(extra.length) line += `\n     ${extra.join(' / ')}`;
  return line;
}

function buildAssignMessage(){
  const groups = { A: [], B: [], none: [] };
  getAllNos().forEach(no=>{
    const p = player(no);
    const g = assignment[no] || 'none';
    groups[g].push(p);
  });
  ['A','B','none'].forEach(k=>groups[k].sort((a,b)=>a.no-b.no));

  let msg = `選手登録一覧（${teamName}）\n`;
  msg += `━━━━━━━━━━\n`;
  msg += `Group A（${groups.A.length}名）\n`;
  msg += groups.A.length ? groups.A.map(formatPlayerDetailLine).join('\n') : '（登録なし）';
  msg += `\n━━━━━━━━━━\n`;
  msg += `Group B（${groups.B.length}名）\n`;
  msg += groups.B.length ? groups.B.map(formatPlayerDetailLine).join('\n') : '（登録なし）';
  if(groups.none.length){
    msg += `\n━━━━━━━━━━\n`;
    msg += `未振分（${groups.none.length}名）\n`;
    msg += groups.none.map(formatPlayerDetailLine).join('\n');
  }
  return msg;
}

// Robust copy: navigator.clipboard requires a "secure context" (https/localhost).
// A file opened from the Files app / a local file is often NOT considered
// secure, so clipboard.writeText silently fails there — this is very likely
// why nothing was getting copied. Fall back to the older execCommand method,
// which works in more places including local files.
async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){ /* fall through to legacy method */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.width = '1px';
    ta.style.height = '1px';
    ta.style.padding = '0';
    ta.style.border = 'none';
    ta.style.opacity = '0';
    ta.style.fontSize = '16px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length); // iOS Safari needs this in addition to .select()
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){
    return false;
  }
}

document.getElementById('sendLine').addEventListener('click', ()=>{

  const text = mode === 'assign' ? buildAssignMessage() : buildMessage();

  // Fire-and-forget copy — NOT awaited, so opening LINE below still
  // happens synchronously within this tap (required for mobile browsers
  // to allow the app hand-off).
  copyToClipboard(text);
  showToast('コピーしました。LINEを開いたら貼り付けて送信してください');

  // Just launch the LINE app itself (no message text in the URL), so
  // there's nothing that can be "too long" and error out on any device.
  window.location.href = 'line://';
});

// ---- persistence ----
// window.storage only exists inside Claude's own artifact preview.
// Once this file is saved to the Files app and opened directly in Safari,
// window.storage is gone, so we fall back to localStorage, which is what
// actually persists across closing/reopening the file on the phone.
async function storageSet(key, valueStr){
  if(window.storage){
    try{ await window.storage.set(key, valueStr); return; }catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(key, valueStr); }catch(e){ /* storage unavailable */ }
}

async function storageGet(key){
  if(window.storage){
    try{
      const res = await window.storage.get(key);
      if(res && typeof res.value === 'string') return res.value;
    }catch(e){ /* fall through */ }
  }
  try{
    const v = localStorage.getItem(key);
    if(v !== null) return v;
  }catch(e){ /* storage unavailable */ }
  return null;
}

async function persist(){
  await storageSet('lineup-draft-v5', JSON.stringify({
    opponent: document.getElementById('opponent').value,
    date: document.getElementById('matchDate').value,
    assignment: assignment,
    A: { first: Array.from(selected.A.first), second: Array.from(selected.A.second) },
    B: { first: Array.from(selected.B.first), second: Array.from(selected.B.second) },
    scores: scores,
    comments: comments,
    goals: goals,
  }));
}

async function persistOverrides(){
  await storageSet('player-registry-v1', JSON.stringify({
    overrides: overrides,
    addedNos: addedNos,
    deletedNos: Array.from(deletedNos),
  }));
}

async function persistTeamName(){
  await storageSet('team-name', teamName);
}

async function loadPersisted(){
  let raw = await storageGet('lineup-draft-v5');
  if(!raw) raw = await storageGet('lineup-draft-v4'); // migrate from earlier version
  if(raw){
    try{
      const data = JSON.parse(raw);
      // 対戦相手・試合結果(得点)・得点者/アシスト・出場選手チェック・コメントは
      // 毎回リセットする仕様のため、ここでは意図的に復元しない。
      // 選手登録（A/B振り分け・名簿）のみ復元する。
      assignment = data.assignment || {};
    }catch(e){ /* corrupt draft, ignore */ }
  }
  // Always start fresh for these, regardless of what was saved previously.
  document.getElementById('opponent').value = '';
  scores = { A:{own:'',opp:''}, B:{own:'',opp:''} };
  goals = { A: [], B: [] };
  comments = { A:{good:'',issue:'',other:''}, B:{good:'',issue:'',other:''} };
  selected = {
    A: { first: new Set(), second: new Set() },
    B: { first: new Set(), second: new Set() },
  };

  let regRaw = await storageGet('player-registry-v1');
  if(regRaw){
    try{
      const data = JSON.parse(regRaw);
      overrides = data.overrides || {};
      addedNos = data.addedNos || [];
      deletedNos = new Set(data.deletedNos || []);
    }catch(e){ /* corrupt registry, ignore */ }
  } else {
    const legacy = await storageGet('player-info-overrides');
    if(legacy){
      try{ overrides = JSON.parse(legacy) || {}; }catch(e){ /* ignore */ }
    }
  }

  // チーム名はアプリを閉じても保持する（対戦相手などとは違いリセットしない）。
  const savedTeamName = await storageGet('team-name');
  if(savedTeamName) teamName = savedTeamName;
}
